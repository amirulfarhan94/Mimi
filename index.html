<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mimi</title>
  <meta name="description" content="Daily diary, expense tracker and duit kutu groups — all in one sweet little app.">
  <meta name="theme-color" content="#fde8ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1117" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mimi">
  <link rel="preload" href="fonts/quicksand-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/dancing-script-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Mimi — Dashboard">
      <img src="icons/icon-192.png" alt="" width="34" height="34">
      <span id="pageTitle">Mimi</span>
    </a>
    <a class="icon-btn" href="#/settings" aria-label="Settings" data-icon="gear"></a>
  </header>

  <div id="updateBar" class="update-bar" hidden>
    <span>A new version is available.</span>
    <button class="btn sm primary">Reload</button>
  </div>

  <main id="main" class="main"></main>

  <button id="fab" class="fab" aria-label="Add" data-icon="plus" hidden></button>

  <nav class="tabbar" aria-label="Main navigation">
    <a href="#/" data-tab="home" data-icon="home"><span>Home</span></a>
    <a href="#/diary" data-tab="diary" data-icon="book"><span>Diary</span></a>
    <a href="#/expenses" data-tab="expenses" data-icon="wallet"><span>Expenses</span></a>
    <a href="#/kutu" data-tab="kutu" data-icon="users"><span>Kutu</span></a>
  </nav>

  <dialog id="sheet" class="sheet" aria-labelledby="sheetTitle"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:1rem">Mimi needs JavaScript to run.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
